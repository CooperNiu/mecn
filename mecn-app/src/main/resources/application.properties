# MECN Application Configuration
server.port=8080

# Spring Boot Application
spring.application.name=mecn

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# DataHub Configuration
mecn.datahub.fred.api-key=${FRED_API_KEY:}
mecn.datahub.worldbank.enabled=true
mecn.datahub.akshare.enabled=true

# Cache Configuration
mecn.cache.enabled=true
mecn.cache.ttl=3600

# WebSocket Configuration
spring.websocket.max-text-message-size=1MB
spring.websocket.max-binary-message-size=1MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.mecn=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
